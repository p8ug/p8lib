[project]
name = "prog8libtool"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
p8lib = "p8lib:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["p8lib"]

[tool.setuptools.dynamic]
version = { attr = "p8lib.__version__" }
